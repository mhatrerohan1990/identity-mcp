<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>identity-mcp</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #6a737d; --border: #d9dee3;
    --accent: #2f5fd0; --accent-text: #fff; --user: #e8eefc; --code: #f0f2f5; --err: #b42318; --err-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1a1e25; --text: #e6e9ee; --muted: #8b95a1; --border: #2d333b;
      --accent: #5b8def; --accent-text: #0b1020; --user: #22304f; --code: #20252d; --err: #ff8a80; --err-bg: #3a1d1b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; max-width: 100%; }
  .msg.user { align-self: flex-end; max-width: 80%; }
  .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); }
  .bot .bubble { background: var(--panel); border: 1px solid var(--border); }
  .bubble.error { background: var(--err-bg); border-color: var(--err); color: var(--err); }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); user-select: none; }
  pre { margin: 6px 0 0; padding: 10px 12px; background: var(--code); border-radius: 8px; overflow-x: auto; white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tablebox { margin-top: 6px; max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 5px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--code); }
  .steps { margin-top: 0; }
  .step { margin: 4px 0; font-size: 13px; color: var(--muted); }
  .step b { color: var(--text); font-weight: 600; }
  .step.bad { color: var(--err); }
  #mode { margin-left: auto; font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); }
  .rate { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .rate button { font: inherit; font-size: 14px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; }
  .rate button:hover:not(:disabled) { border-color: var(--accent); }
  .rate button:disabled { opacity: .5; cursor: default; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .typing { color: var(--muted); font-style: italic; }
  #newchat { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  #newchat:hover { color: var(--text); border-color: var(--accent); }
  .hints { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .hints button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text); cursor: pointer; }
  .hints button:hover { border-color: var(--accent); }
  .welcome { color: var(--muted); }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>identity-mcp</h1><span>Ask questions about users, groups, apps, access and activity</span><select id="mode" title="How questions are answered"><option value="agent">Agent (chains tools)</option><option value="single">Single query</option></select><button type="button" id="newchat" title="Forget the conversation so far">New chat</button></header>
<div id="log"><div class="wrap" id="chat">
  <div class="msg bot" id="welcome"><div class="bubble welcome">Ask a question in plain English. Try one of these:
    <div class="hints" id="hints"></div></div></div>
</div></div>
<form id="form"><div class="row">
  <textarea id="q" rows="1" placeholder="Ask a question…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
  <button id="send" type="submit">Ask</button>
</div></form>
<script>
const chat = document.getElementById("chat"), log = document.getElementById("log"), form = document.getElementById("form");
const q = document.getElementById("q"), send = document.getElementById("send"), mode = document.getElementById("mode");
const history = [];  // earlier turns of this chat; sent with each question so follow-ups can be resolved (lost on refresh)
const HISTORY_SENT = 3, ROWS_KEPT = 20;
const SAMPLES = [
  "How many users are terminated?",
  "Which terminated users still have access to anything?",
  "Which active admins have had no activity in the last 90 days?",
  "Which privileged group members don't have MFA?",
  "Which department has the most admin grants?",
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only: model output is never parsed as HTML
  return e;
}
function scroll() { log.scrollTop = log.scrollHeight; }

function addUser(text) {
  const m = el("div", "msg user"); m.append(el("div", "bubble", text)); chat.append(m); scroll();
}

function resultTable(columns, rows) {
  const box = el("div", "tablebox"), t = el("table"), thead = el("thead"), head = el("tr");
  columns.forEach(c => head.append(el("th", null, c)));
  thead.append(head); t.append(thead);
  const body = el("tbody");
  rows.forEach(r => { const tr = el("tr"); r.forEach(v => tr.append(el("td", null, v === null ? "NULL" : String(v)))); body.append(tr); });
  t.append(body); box.append(t); return box;
}

function addBot(data) {
  const m = el("div", "msg bot"), failed = !!data.error;
  m.append(el("div", failed ? "bubble error" : "bubble", data.answer || data.error));
  if (data.standalone_question) m.append(el("div", "meta", `Interpreted as: ${data.standalone_question}`));
  if (data.sql) {
    const fixed = data.repairs > 0 && !failed;
    const d = el("details"); d.append(el("summary", null, fixed ? `SQL (fixed after ${data.repairs} retry)` : "SQL"));
    d.append(el("pre", null, data.sql)); m.append(d);
  }
  const rejected = (data.attempts || []).filter(a => !a.ok && !(failed && a.sql === data.sql));
  if (rejected.length) {  // earlier queries that failed validation, with the reasons the model was shown
    const d = el("details"); d.append(el("summary", null, `Rejected attempts (${rejected.length})`));
    rejected.forEach(a => d.append(el("pre", null, `${a.sql}\n\n-- ${a.stage}: ${a.errors.join(" | ")}`)));
    m.append(d);
  }
  if (data.columns && data.rows && data.rows.length) {
    const d = el("details"), n = data.row_count + (data.truncated ? "+" : "");
    d.append(el("summary", null, `Results (${n} row${data.row_count === 1 ? "" : "s"})`));
    d.append(resultTable(data.columns, data.rows)); m.append(d);
  }
  if (data.timings_ms) {
    const total = Object.values(data.timings_ms).reduce((a, b) => a + b, 0);
    const parts = Object.entries(data.timings_ms).map(([k, v]) => `${k.replace("_", " ")} ${(v / 1000).toFixed(1)}s`);
    m.append(el("div", "meta", `${(total / 1000).toFixed(1)}s total · ${parts.join(" · ")}`));
  }
  chat.append(m); scroll();
  if (!failed && data.answer) addRating(m, { question: data.question || "", answer: data.answer, mode: "single", verified: null,
    steps: data.sql ? [{ tool: "sql", question: data.standalone_question || data.question || "", sql: data.sql, linked: false, error: "" }] : [] });
}

const SCOPE = { query_identity: "identity", query_activity: "activity" };

function stepTable(m, ev) {  // one tool result: a line, with the SQL and rows folded underneath
  const bad = !!ev.error, scope = SCOPE[ev.name] || ev.name;
  const line = el("div", bad ? "step bad" : "step");
  line.append(el("b", null, `\u2190 ${scope}: `), document.createTextNode(bad ? ev.error : `${ev.row_count} row${ev.row_count === 1 ? "" : "s"}${ev.truncated ? " (first " + ev.rows.length + " shown)" : ""}`));
  m.steps.append(line);
  if (ev.sql) { const d = el("details"); d.append(el("summary", null, "SQL")); d.append(el("pre", null, ev.sql)); m.steps.append(d); }
  if (ev.rows && ev.rows.length) { const d = el("details"); d.append(el("summary", null, "Rows")); d.append(resultTable(ev.columns, ev.rows)); m.steps.append(d); }
}

function addStep(m, ev) {
  if (ev.type === "tool_call") {
    const line = el("div", "step"), link = ev.filter_from ? " (using the previous result)" : "";
    line.append(el("b", null, `\u2192 ${SCOPE[ev.name] || ev.name}: `), document.createTextNode(ev.question + link));
    m.steps.append(line);
  } else if (ev.type === "tool_result") stepTable(m, ev);
  else if (ev.type === "revise") m.steps.append(el("div", "step bad", "The answer did not match the data; the model was asked to fix it."));
  else if (ev.type === "verification") m.steps.append(el("div", ev.ok ? "step" : "step bad", ev.ok ? "\u2713 Answer checked against the results" : `Check found: ${ev.issues.join(" ")}`));
  else if (ev.type === "nudge") m.steps.append(el("div", "step", "(the model wrote text instead of calling a tool; asked to try again)"));
}

// Thumbs under an answer. `steps` are the queries behind it ({tool, question, sql, linked, error}); they are what a reviewer
// may later promote into the question bank (thumbs up) or turn into an eval case (thumbs down). Nothing is promoted automatically.
function addRating(m, info) {
  const row = el("div", "rate"), up = el("button", null, "\u{1F44D}"), down = el("button", null, "\u{1F44E}"), note = el("span");
  up.title = "Good answer"; down.title = "Wrong or unhelpful";
  const send = async (rating) => {
    const comment = rating === "down" ? (window.prompt("What was wrong? (optional)") || "") : "";
    up.disabled = down.disabled = true;
    try {
      const r = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rating, comment, ...info }) });
      note.textContent = r.ok ? "Thanks, saved." : `Could not save (${r.status}).`;
    } catch (e) { note.textContent = "Could not save."; }
  };
  up.addEventListener("click", () => send("up")); down.addEventListener("click", () => send("down"));
  row.append(up, down, note); m.append(row);
}

async function askAgent(question) {
  const m = el("div", "msg bot"), box = el("div", "bubble"), status = el("div", "typing", "Thinking\u2026");
  m.steps = el("div", "steps"); box.append(m.steps, status); m.append(box); chat.append(m); scroll();
  let answer = null, failed = null;
  const steps = [];  // for feedback: one entry per tool call, completed by its result
  const r = await fetch("/api/agent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history: history.filter(t => t.answer).slice(-HISTORY_SENT) }) });
  if (!r.ok) throw new Error(`Server returned ${r.status}`);
  const reader = r.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  const handle = line => {
    if (!line.trim()) return;
    const ev = JSON.parse(line);
    if (ev.type === "tool_call") steps.push({ tool: ev.name, question: ev.question, sql: "", linked: !!ev.filter_from, error: "" });
    else if (ev.type === "tool_result" && steps.length) Object.assign(steps[steps.length - 1], { sql: ev.sql || "", error: ev.error || "" });
    if (ev.type === "answer") answer = ev; else if (ev.type === "error") failed = ev.message; else addStep(m, ev);
    scroll();
  };
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n"); buffer = lines.pop();
    lines.forEach(handle);
  }
  handle(buffer);
  status.remove();
  if (failed || !answer) { box.classList.add("error"); box.append(el("div", null, failed || "The agent returned no answer.")); return; }
  m.insertBefore(el("div", "bubble", answer.text), box);  // the answer first, the steps it took folded below it
  const d = el("details"); d.append(el("summary", null, `Steps (${m.steps.querySelectorAll(".step").length})`));
  box.replaceWith(d); d.append(m.steps);
  m.append(el("div", "meta", `${(answer.elapsed_ms / 1000).toFixed(1)}s \u00b7 ${answer.steps} model call${answer.steps === 1 ? "" : "s"}` + (answer.verified === true ? " \u00b7 \u2713 checked against the results" : answer.verified === false ? " \u00b7 \u26a0 not fully verified" : "")));
  history.push({ question, answer: answer.text });
  addRating(m, { question, answer: answer.text, mode: "agent", verified: answer.verified, steps });
}

async function ask(question) {
  addUser(question);
  if (mode.value === "agent") {
    send.disabled = true;
    try { await askAgent(question); } catch (e) { addBot({ error: `Request failed: ${e.message}` }); }
    finally { send.disabled = false; q.focus(); }
    return;
  }
  const wait = el("div", "msg bot"); wait.append(el("div", "bubble typing", "Thinking…")); chat.append(wait); scroll();
  send.disabled = true;
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history: history.slice(-HISTORY_SENT) }) });
    if (!r.ok) throw new Error(`Server returned ${r.status}`);
    const data = await r.json();
    wait.remove(); addBot(data);
    if (!data.error) history.push({ question, answer: data.answer || null, columns: data.columns || [], rows: (data.rows || []).slice(0, ROWS_KEPT) });
  } catch (e) {
    wait.remove(); addBot({ error: `Request failed: ${e.message}` });
  } finally {
    send.disabled = false; q.focus();
  }
}

document.getElementById("newchat").addEventListener("click", () => {
  history.length = 0;  // start over: the next question is answered without earlier context
  while (chat.children.length > 1) chat.children[1].remove();
});

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || send.disabled) return;
  q.value = ""; q.style.height = "auto";
  ask(text);
});
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; });
SAMPLES.forEach(s => {
  const b = el("button", null, s); b.type = "button";
  b.addEventListener("click", () => { if (!send.disabled) ask(s); });
  document.getElementById("hints").append(b);
});
</script>
</body>
</html>
