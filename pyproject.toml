[project]
name = "identity-mcp"
version = "0.1.0"
description = "Ask your access-governance data questions in plain English: few-shot RAG over curated examples, guarded SQL, served over MCP."
readme = "README.md"
authors = [
    { name = "Rohan Mhatre", email = "mhatrerohan1990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
agent = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.19",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.19",
    "pytest>=9.2.0",
    "sqlglot>=30.29.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
